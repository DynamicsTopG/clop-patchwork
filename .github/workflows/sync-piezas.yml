name: Sincronizar piezas

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-piezas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_COMMIT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests Pillow

      - name: Sync from Google Form
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: python scripts/sync_piezas.py

      - name: Commit changes
        run: |
          git config user.name "CLOP bot"
          git config user.email "bot@users.noreply.github.com"
          git add _data/piezas.json img/piezas index.html
          git diff --staged --quiet || git commit -m "Actualizar piezas desde el formulario"
          git push
